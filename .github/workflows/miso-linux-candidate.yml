name: Miso Linux x64 candidate
on:
  push:
    branches: [feat/miso-3d-space]
permissions:
  contents: read
concurrency:
  group: miso-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:1/build_only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          architecture: x64
          package-manager-cache: false
      - name: Pin documented npm
        run: npm install --global npm@11.9.0
      - name: Initialize disposable PostgreSQL and record environment
        run: python3 scripts/ci/linux.py init
      - name: Reproduce lock and generate Prisma client
        run: |
          npm ci
          git diff --exit-code -- package-lock.json
      - name: Prisma behavior, schema and existing migrations
        run: |
          node scripts/check-prisma-overrides.mjs
          node_modules/.bin/prisma validate
          node scripts/local-integration.mjs migrate
          node scripts/local-integration.mjs migration-status
      - name: Unit tests
        run: npm test
      - name: PostgreSQL integration
        run: node scripts/local-integration.mjs test
      - name: Distribution negative tests
        run: python3 scripts/test_distribution.py
      - name: TypeScript and lint
        run: |
          node_modules/.bin/next typegen
          node_modules/.bin/tsc --noEmit
          npm run lint
      - name: Full and runtime audits
        run: |
          npm audit --json > "$RUNNER_TEMP/reports/audit-full.json"
          npm audit --omit=dev --json > "$RUNNER_TEMP/reports/audit-runtime.json"
      - name: Isolated build, package, secret and native checks
        run: python3 scripts/ci/linux.py prepare
      - name: Retain exact candidate for independent validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miso-linux-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/candidate/*.tar.gz
            ${{ runner.temp }}/candidate/*.sha256
            ${{ runner.temp }}/candidate/manifest.json
            ${{ runner.temp }}/candidate/build-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove owned disposable database
        if: always()
        run: python3 scripts/ci/linux.py cleanup
  validate-package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:1/build_only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          architecture: x64
          package-manager-cache: false
      - name: Pin documented npm
        run: npm install --global npm@11.9.0
      - name: Independent database and environment
        run: python3 scripts/ci/linux.py init
      - name: Install test harness only, outside package
        run: |
          npm ci
          git diff --exit-code -- package-lock.json
          node scripts/local-integration.mjs migrate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miso-linux-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Verify checksum, unpack and negative tests
        run: python3 scripts/ci/linux.py unpack
      - name: Test extracted runtime and real browser
        run: node scripts/check-packaged-runtime.mjs "$RUNNER_TEMP/runtime"
      - name: Review publishable results and preserve tested checksum
        run: python3 scripts/ci/linux.py finish
      - name: Retain validated package unchanged
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miso-linux-validated-${{ github.sha }}
          path: |
            ${{ runner.temp }}/validated/*.tar.gz
            ${{ runner.temp }}/validated/*.sha256
            ${{ runner.temp }}/validated/manifest.json
            ${{ runner.temp }}/validated/results.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove owned disposable database
        if: always()
        run: python3 scripts/ci/linux.py cleanup
